<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio del mundo 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #223; overflow: hidden; font: 13px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #bar { position: fixed; left: 6px; bottom: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  #bar button { font: inherit; padding: 4px 7px; border-radius: 8px; border: 0; background: #fffd; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<script type="module">
// Monta el mundo 3D a pantalla completa para probarlo sin la interfaz.
// Parámetros: grow=0.5..1 (tamaño) · arrival=<seg> open=<seg> (llegada en la jaulita) · room=sala|cocina|bano|dormitorio|capilla · lights=0 · candle=1 · wear=head:gorra,neck:bufanda,beak:flor
//             mood=… · sleep=1 · dirt=0..1 · foam=0..1 · fx=hearts|sparkles|… · still=<seg> (simula y congela) · bar=0
// Deja window.__world, window.__ready y window.__error.
import { createWorld } from '../js/pet/world.js';
const q = new URLSearchParams(location.search);
try {
  const world = createWorld(document.getElementById('c'));
  window.__world = world;
  await world.setRoom(q.get('room') || 'sala', { instant: true });
  if (q.get('lights') === '0') world.setLights(false);
  if (q.get('candle') === '1') world.setCandle(true);
  if (q.has('mood')) world.dove.setMood(q.get('mood'));
  if (q.get('sleep') === '1') { world.dove.setSleeping(true); world.fx.zzz(true); }
  if (q.has('dirt')) world.dove.setDirt(+q.get('dirt'));
  if (q.has('foam')) world.fx.foam(+q.get('foam'));
  for (const pair of (q.get('wear') || '').split(',').filter(Boolean)) { const [slot, id] = pair.split(':'); world.wear(slot, id); }
  if (q.has('grow')) world.setGrowth(+q.get('grow'));
  // arrival=<seg>: llegada en la jaulita, simulada esos segundos; open=<seg>: luego la abre y simula esos segundos más.
  if (q.has('arrival')) {
    world.startArrival();
    if (q.has('still')) { world.simulate(+q.get('arrival') || 3); if (q.has('open')) { world.openArrival(); world.simulate(+q.get('open') || 1); } }
  }
  if (q.has('still')) {
    world.simulate(+q.get('still') || 1.5);
    if (q.has('fx')) { world.fx[q.get('fx')]?.(true); world.simulate(0.5); }
  } else {
    world.start();
    if (q.has('fx')) setTimeout(() => world.fx[q.get('fx')]?.(true), 500);
  }
  if (q.get('bar') !== '0') {
    const bar = document.getElementById('bar');
    const b = (t, f) => { const e = document.createElement('button'); e.textContent = t; e.onclick = f; bar.append(e); };
    for (const r of world.ROOMS) b(r, () => world.setRoom(r));
    for (const f of ['hearts', 'sparkles', 'crumbs', 'notes', 'stars', 'splash', 'confetti']) b(f, () => world.fx[f]());
    let L = true, C = false, S = false; b('luz', () => world.setLights(L = !L)); b('vela', () => world.setCandle(C = !C)); b('ducha', () => world.fx.shower(S = !S));
  }
  world.on('tap', e => { world.dove.play(e.part === 'feet' ? 'hop' : 'giggle'); world.fx.hearts(3); });
  world.on('tapProp', e => console.log('prop', e.id));
  window.__ready = true;
} catch (e) { window.__error = String(e && e.stack || e); console.error(e); window.__ready = true; }
</script>
</body>
</html>
