// App de Android de Palomita: una pantalla completa con la app web empaquetada dentro (funciona sin internet).
// Antes de compilar, tools/build-apk.sh copia dist/palomita.html a src/main/assets/index.html.
plugins { id 'com.android.application' }

// Firma: si existe android/keystore.properties (no se sube al repositorio) se usa esa llave.
// Sin ella NO se compila la versión para las familias (una versión firmada con otra llave no se puede instalar
// encima de la anterior y se perdería el avance de los niños). Para una prueba local se puede forzar la llave
// de depuración con la variable de entorno PALOMITA_FIRMA_DEPURACION=1. La huella de la llave correcta está en
// android/firma-sha256.txt (tools/build-apk.sh la comprueba al terminar).
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.palomita.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.palomita.app'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
            if (!ksFile.exists() && System.getenv('PALOMITA_FIRMA_DEPURACION') != '1') {
                println 'AVISO: falta android/keystore.properties: este APK NO servirá para actualizar el de las familias.'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'html', 'ogg', 'jpg', 'webp' }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
